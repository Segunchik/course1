[project]
name = "course1"
version = "0.1.0"
description = ""
authors = [
    {name = "Sergey Parkhanovich",email = "komrad.segunchik@yandex.ru"}
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pytest (>=8.4.2,<9.0.0)",
    "yfinance (>=0.2.66,<0.3.0)",
    "python-dotenv (>=1.2.1,<2.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.dev.dependencies]
pytest = "^8.4.2"
freezegun = "^1.5.5"
pytest-cov = "^7.0.0"
openpyxl = "^3.1.5"


[tool.poetry.group.linter.dependencies]
flake8 = "^7.3.0"
isort = "^7.0.0"
black = "^25.9.0"
mypy = "^1.18.2"



[tool.poetry.group.lint.dependencies]
black = "^25.9.0"

[tool.mypy]
disallow_untyped_defs = true
warn_return_any = true
exclude = ["venv",".venv"]


[tool.black]
# Максимальная длина строки
line-length = 119
# Файлы, которые не нужно форматировать
exclude = '''
(
    /(
        \.git     # исключить директорию Git
    |   \.venv    # исключить виртуальное окружение
    )
)
'''


[tool.isort]
line_length = 119
